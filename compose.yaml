services: 
  app: 
    build: 
      context: .
    cap_add:
      - NET_RAW
      - NET_ADMIN
    container_name: seeker-app
    #ports: 
    #  - '5000:5000'
    networks:
      - caddy-network
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - caddy-network
networks:
  caddy-network:

volumes:
  caddy_data:
  caddy_config:
  captures: